# Shadows the file of the same name in /usr/share/wireplumber/wireplumber.conf.d/,
# which turns on role-based linking: every stream is routed into a per-role
# loopback sink (multimedia, notification, phone, ringtone, alarm, alert) that
# then feeds the real sink. That gives phone-style ducking, but it also means
# per-application effects and mixers see the loopbacks rather than the
# applications -- EasyEffects lists "output.loopback.sink.*" instead of Firefox.
wireplumber.profiles = {
  main = {
    policy.linking.role-based.loopbacks = disabled
  }
}
