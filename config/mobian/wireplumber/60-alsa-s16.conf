# The MI2S link this card uses runs on a bit clock hardcoded in sound/soc/qcom/
# sm8250.c as 48000 * 2 * 16, so the frame only holds 16-bit samples. Opening
# the device any wider feeds the speaker amplifiers a malformed frame and they
# fall silent -- PulseAudio happened to pick S16LE and hid this; PipeWire picks
# S24_32LE. Pinning it here is the workaround; fixing it properly in the machine
# driver still needs work.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" } ]
    actions = { update-props = { audio.format = "S16LE" } }
  }
]
