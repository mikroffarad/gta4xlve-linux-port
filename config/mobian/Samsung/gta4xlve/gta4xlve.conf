# Use case configuration for Samsung Galaxy Tab S6 Lite (2022) (gta4xlve)

Syntax 4

SectionUseCase."HiFi" {
	File "/Samsung/gta4xlve/HiFi.conf"
	Comment "HiFi quality Music."
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"

BootSequence [
	# Two TAS2562 amplifiers, one per channel, so each takes its own side
	# rather than the LeftRightDiv2 a single mono amplifier would use.
	cset "name='Left ASI1 Sel' Left"
	cset "name='Right ASI1 Sel' Right"

	# Max value 110 reads outside the dB lookup table, so use 109 instead.
	cset "name='Left Digital Volume Control' 109"
	cset "name='Right Digital Volume Control' 109"
]
